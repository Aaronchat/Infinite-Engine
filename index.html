<!doctype html><html><head><meta charset='utf-8'>
<meta name='viewport' content='width=device-width,initial-scale=1'>
<title>Infinite Engine</title>
<link rel='stylesheet' href='style.css'>
</head><body>
<div class='card'>
<h1>♾️ Infinite Engine</h1>
<label><input id='horror' type='checkbox' checked> Horror</label>
<label><input id='fantasy' type='checkbox' checked> Fantasy</label>
<label><input id='scifi' type='checkbox' checked> Sci‑Fi</label>
<label><input id='modern' type='checkbox' checked> Modern</label>
<hr>
<p><b>Character:</b> <span id='character'></span></p>
<p><b>Outfit:</b> <span id='outfit'></span></p>
<p><b>Location:</b> <span id='location'></span></p>
<p><b>Chaos:</b> <span id='chaos'></span></p>
<textarea id='prompt' rows='7'></textarea><br><br>
<button id='gen'>🎲 Generate</button>
<button id='copy'>📋 Copy Prompt</button>
</div>
<script src="themes.js"></script>
<script src="outfits.js"></script>
<script src="locations.js"></script>
<script src="chaos.js"></script>
<script src="script.js"></script>
</body></html>
